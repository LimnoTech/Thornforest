[tool.pixi.workspace]
name = "Thornforest"
authors = ["Anthony Aufdenkampe <aaufdenkampe@limno.com>"]
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"

# Data processing
cf-xarray = "*"
cftime = "*"
cfunits = "*"
openpyxl = "*"
pandas = "*"
pyarrow = "*"
pyyaml = "*"
xarray = "*"
zarr = ">=3"

# Geospatial
gdal = "*"
geopandas = "*"
libgdal-arrow-parquet = "*"
libgdal-xls = "*"
py7zr = "*"
pyogrio = "*"
python-libarchive-c = "*"
rasterio = "*"
rioxarray = "*"
xvec = "*"

# Data analysis
exactextract = ">=0.3.0,<0.4"
pymannkendall = ">=1.4.3,<2"

# Remote Access
fsspec = "*"
python-dotenv = ">=1.2.2,<2"
s3fs = "*"
universal_pathlib = "*"

# USGS packages for data fetching
dataretrieval = "*"

# HyRiver packages for data fetching
hydrosignatures = ">=0.19"
pygeohydro = ">=0.19"
pygeoogc = ">=0.19"
pynhd = ">=0.19"

# Visualization
colorcet = ">=3.2.1,<4"
hvplot = "*"
geoviews = "*"

# Interactivity via Jupyter Notebooks
ipywidgets = "*"
ipywidgets_bokeh = "*"
jupyter_bokeh = "*"
jupyterlab = "*"
jupyterlab-lsp = "*"
jupytext = "*"
pyviz_comms = "*"

# Development & Testing
pytest = "*"
pytest-cov = "*"
pyrefly = "*"
ruff = "*"

# Documentation
quarto = ">=1.9.38,<2"

[tool.pixi.pypi-dependencies]
# Put pip/uv commands or dependencies only available in PyPI here

[tool.pixi.tasks]
# Render the Quarto website into _site/ (executes notebooks as needed, refreshes _freeze/).
render = "quarto render"
preview = "quarto preview"
# Run the unit test suite.
test = "pytest"
# Lint and format the helper package and its tests. The numbered notebooks and
# notebooks/sandbox/ are deliberately NOT linted: they are jupytext scripts, where
# top-level statements, out-of-order imports, and display-only expressions are normal.
lint = "ruff check notebooks/_helpers notebooks/tests"
format = "ruff format notebooks/_helpers notebooks/tests"

[tool.pytest.ini_options]
testpaths = ["notebooks/tests"]

[tool.ruff]
line-length = 100
